services:
  db:
    image: postgres:16-alpine
    container_name: kanka_scribe_db
    restart: always
    environment:
      POSTGRES_USER: kanka_scribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kanka_scribe
    volumes:
      - /opt/kanka-scribe/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanka_scribe -d kanka_scribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: /opt/kanka-scribe
    image: kanka-scribe:local
    container_name: kanka_scribe
    restart: always
    ports:
      - "8095:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://kanka_scribe:${POSTGRES_PASSWORD}@db:5432/kanka_scribe
      HANDOFF_DIR: /handoff
      KANKA_API_DOCS: /app/vendor/kanka-api-docs
      # Stay under Kanka CE default API_THROTTLE_LIMIT=30/min
      KANKA_MAX_REQUESTS_PER_MINUTE: ${KANKA_MAX_REQUESTS_PER_MINUTE:-24}
    volumes:
      - ${HANDOFF_HOST_DIR:-/mnt/backups/craig/handoff}:/handoff
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
