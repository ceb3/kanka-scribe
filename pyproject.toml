[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanka-scribe"
version = "0.1.0"
description = "Ingest TTRPG transcripts into Kanka (CE or SaaS) with an external LLM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.1",
  "PyJWT>=2.8",
  "email-validator>=2.0",
  "markdown>=3.5",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
  "cryptography>=42.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
kanka-scribe = "kanka_scribe.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kanka_scribe = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
