services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanka_scribe
      POSTGRES_PASSWORD: kanka_scribe
      POSTGRES_DB: kanka_scribe
    volumes:
      - ks_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanka_scribe -d kanka_scribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://kanka_scribe:kanka_scribe@db:5432/kanka_scribe
      HANDOFF_DIR: /handoff
      DEFAULT_KANKA_PUBLIC_URL: ${DEFAULT_KANKA_PUBLIC_URL:-https://kanka.example}
      DEFAULT_LLM_BASE_URL_PLACEHOLDER: ${DEFAULT_LLM_BASE_URL_PLACEHOLDER:-http://localhost:11434/v1}
      KANKA_MAX_REQUESTS_PER_MINUTE: ${KANKA_MAX_REQUESTS_PER_MINUTE:-24}
    volumes:
      - ${HANDOFF_HOST_DIR:-./data/handoff}:/handoff
    depends_on:
      db:
        condition: service_healthy

volumes:
  ks_pg:
